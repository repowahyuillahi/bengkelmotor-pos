# =====================================================================
# A3 Motor Edisi PHP Native - cuplikan rewrite Nginx untuk aaPanel
# =====================================================================
# Cara pakai di aaPanel:
#   Website -> pilih situs -> Settings -> Rewrite (Pseudo-static),
#   lalu tempel isi file ini dan Save. Pastikan situs memakai PHP 8.x
#   dan folder data/ bisa ditulis oleh user web server (www).
# ---------------------------------------------------------------------

# 1) Semua /api/* diteruskan ke api.php.
#    $request_uri tidak berubah oleh rewrite, jadi app.php tetap
#    membaca alamat /api/... yang asli untuk perutean.
location ^~ /api/ {
    rewrite ^.*$ /api.php last;
}

# 2) /landing tanpa ekstensi -> landing.html
location = /landing {
    rewrite ^ /landing.html break;
}

# 3) Folder data/ (database SQLite) & file backend: tolak akses web.
location ^~ /data/ {
    deny all;
}
location ~ ^/(config|app)\.php$ {
    deny all;
}

# 4) File yang ada disajikan langsung; selain itu ke index.php
#    (aplikasi kasir / SPA). Blok location PHP bawaan aaPanel
#    (fastcgi untuk *.php) tetap dipakai apa adanya.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
